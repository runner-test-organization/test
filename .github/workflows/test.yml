name: Test cache

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - name: create 100 MB file
        run: |
          dd if=/dev/zero of=test-file.bin bs=1M count=105

      - name: Save cache
        uses: actions/cache/save@v6
        with:
          path: |
            test-file.bin
          key: cached-file
